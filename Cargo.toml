[package]
name = "qmkonnect"
version = "0.2.8"
edition = "2021"
authors = ["Mulletware"]
description = "Cross-platform window activity notifier for QMK keyboards"
readme = "README.md"
license = "MIT"
rust-version = "1.88"  # MSRV floor: image 0.25.x (see docs/installation.md)

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Pinned to a tagged release for reproducible CI/release builds. Bump the tag
# when qmk-notifier cuts a newer release. v0.3.0 adds the typed-command
# transport API (CommandResponse return type, RunCommand::{QueryInfo,
# QueryCallback, SetOs, ApplyHostContext}, HostOs) consumed by
# Notifier::send_command (PRD §5.7/§8.4-5, P4.M1.T1).
qmk-notifier = { git = "https://github.com/dabstractor/qmk-notifier", tag = "v0.3.0" }
# hidapi link nuance (ARCHITECTURE invariant 12 / PACKAGING.md §2):
# Arch ships libhidapi-hidraw SEPARATE from libhidapi-libusb, so the Arch
# PKGBUILD (packaging/linux/arch/PKGBUILD) passes
#   RUSTFLAGS="-C link-arg=-lhidapi-hidraw"
# explicitly — usage/usage_page device matching REQUIRES the hidraw backend.
# Debian/Ubuntu/Fedora (+ modern Nixpkgs) ship a UNIFIED hidapi (>=0.14) that
# auto-selects hidraw at runtime, so the .deb/.rpm (P1.M7) and Nix builds must
# NOT pass -lhidapi-hidraw (linking the unified lib is correct). Do NOT add a
# global -lhidapi-hidraw rustflag in .cargo/config.toml — it would break
# unified-hidapi distros. Keep the flag per-channel (Arch PKGBUILD env, Nix
# hidrawFlag).
hidapi = "2.6"
ctrlc = "3.4"
once_cell = "1.21"
dirs = "5.0"
toml = "0.9"
tao = "0.32.8"
tray-icon = "0.20.0"
image = { version = "0.25.5", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.0"

# Linux dependencies
[target.'cfg(target_os = "linux")'.dependencies]
# F16 cross-DE backends (P2.M2/P2.M3/P2.M4 implement the modules; the features
# are declared in [features] so select_linux_backend's #[cfg(feature=…)] probe
# stubs are selectable). All optional + dep:-gated so --no-default-features drops
# them. MSRV note: smithay-client-toolkit 0.20 MSRV is 1.86 (< project floor 1.88 ✓).
smithay-client-toolkit = { version = "0.20", optional = true }   # wayland feature
wayland-client = { version = "0.31", optional = true }          # matches SCTK 0.20's wayland-client major
zbus = { version = "5", optional = true }                       # gnome D-Bus client; atspi 0.30 also uses zbus 5 (unified)
atspi = { version = "0.30", optional = true }                   # pure-Rust AT-SPI2 (odilia-dev)
hyprland = { version = "0.4.0-beta.2", optional = true }
libxdo = "0.6"
tempfile = "3.0"
# libc: only for geteuid() in the root-aware `qmkonnect --reload` config
# resolution (WS3 / #26). No FFI beyond that single call.
libc = "0.2"
# StatusNotifierItem (SNI) over D-Bus — pure-Rust, no GTK main loop. Behind
# the opt-in `linux-tray` feature so the minimal Hyprland service build is
# unchanged (see HANDOFF_LINUX_TRAY_PARITY.md). Notifications and the settings
# dialog shell out to `notify-send` / `zenity` (standard on Linux desktops)
# instead of pulling extra D-Bus crates.
ksni = { version = "0.3", optional = true, features = ["blocking"] }
# Native GTK "Show Window Information" popup. zenity's floating `--forms` list is
# height-capped (~4 rows) and its tall `--list` tiles — a native `GtkWindow` with
# a dialog type-hint floats *and* grows. gtk-rs 0.18 is already compiled into the
# binary (via libappindicator/tray-icon), so this reuses it. Runs on a dedicated
# thread; ksni's IPC thread stays pure-IPC.
gtk = { version = "0.18", optional = true }

# macOS dependencies
[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2.7", optional = true }
objc2-foundation = "0.3.0"
objc2-core-foundation = "0.3.0"
core-foundation = { version = "0.9", optional = true }
core-graphics = { version = "0.23.2", optional = true }
libc = "0.2"
dispatch = { version = "0.2", optional = true }

# Windows dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    # Per-user "Open at Login" autostart via the HKCU `Run` key
    # (src/autostart.rs; HANDOFF_WINDOWS_OPEN_AT_LOGIN.md).
    "Win32_System_Registry",
    # WinRT toast infrastructure (P1.M4.T1 — spec/UI.md §2.3 mandates a toast, not
    # the current modal MessageBoxW, for the "rules.toml invalid" notification):
    #   - Win32_UI_Shell: SetCurrentProcessExplicitAppUserModelID (sets the process AUMID
    #     at startup so the toast subsystem accepts notifications from this app).
    #   - UI_Notifications: windows::UI::Notifications (ToastNotificationManager /
    #     ToastNotification / ToastNotifier) — consumed by P1.M4.T1.S2.
    #   - Data_Xml_Dom: windows::Data::Xml::Dom (XmlDocument to build the toast XML
    #     payload) — consumed by P1.M4.T1.S2.
    # Win32_Foundation is already present and auto-cascades; do not re-add it.
    "Win32_UI_Shell",
    "UI_Notifications",
    "Data_Xml_Dom",
    # WinRT toast COM init (P1.M4.T1.S2): CoInitializeEx/CoUninitialize — WinRT
    # toast calls require the calling thread to hold a COM apartment (unlike
    # set_aumid above, which is pure Win32 and needs none). Sibling to the three
    # features directly above.
    "Win32_System_Com",
] }
log = "0.4"
env_logger = "0.11"
eventlog = "0.2.2"
single-instance = "0.3"



[features]
# The tray is part of the default app on every platform that has one
# (macOS/Windows via tray.rs, Linux via the SNI `linux-tray` module). On a
# given OS the other platforms' features are inert no-ops (e.g. `macos` on
# Linux, `linux-tray` on macOS) — the same pattern already used for `macos`.
# This keeps plain `cargo build --release` producing the full app with a tray,
# with no extra flags. Pass `--no-default-features` for a minimal service build.
#
# Linux window-monitor backends (runtime-selected by select_linux_backend,
# PLATFORMS.md §6). All default-on so a single binary works everywhere;
# turn a backend off to shrink the binary / drop a dep (spec/PACKAGING.md §2).
# On a given OS the other platforms' features are inert no-ops.
default = ["wayland", "gnome", "atspi", "hyprland", "macos", "linux-tray"]
# foreign-toplevel (covers Hyprland/Sway/Niri/wlroots/KDE/COSMIC).
wayland = ["dep:smithay-client-toolkit", "dep:wayland-client"]
# GNOME Shell-extension D-Bus client.
gnome = ["dep:zbus"]
# a11y-bus fallback.
atspi = ["dep:atspi"]
# legacy Hyprland-IPC backend (superseded by wayland).
hyprland = ["dep:hyprland"]
macos = ["dep:objc", "dep:core-foundation", "dep:core-graphics", "dep:dispatch"]
# StatusNotifierItem tray for the Linux/Wayland build. Default-on (see above);
# can be disabled with `--no-default-features` for a trayless service build.
# Registers the app on the session D-Bus; any SNI-hosting bar (Waybar, SwayNC,
# KDE, GNOME +AppIndicator, …) renders the icon+menu. "Show Window Information"
# uses `notify-send` and Settings uses `zenity` (standard on Linux desktops).
linux-tray = ["dep:ksni", "dep:gtk"]

[[bin]]
name = "qmkonnect"
path = "src/main.rs"

# udev helper (Linux only in practice, but pure-std so it builds everywhere).
# Parses a hidraw interface's report descriptor and prints ID_QMKONNECT=1 when
# it carries the QMK Raw HID signature (usage page 0xFF60 / usage 0x61). The
# static udev rule IMPORTs this; see packaging/linux/udev/69-qmkonnect-rawhid.rules.
[[bin]]
name = "qmkonnect-hid-id"
path = "src/bin/hid_id.rs"

# Optimize for size
[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = "abort"     # Abort on panic instead of unwinding
strip = true        # Strip symbols from binary



