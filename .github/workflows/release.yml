name: Release

# Builds the per-platform installers/binaries and publishes a GitHub Release.
#
# Two triggers:
#   * push of a `v*` tag  -> builds everything AND publishes the release
#   * workflow_dispatch   -> builds everything WITHOUT publishing, so you can
#                            dry-run the whole pipeline (and download the real
#                            .dmg / .exe / .pkg.tar.zst from the run) before you
#                            ever cut a tag. Use this to get Windows/macOS working.
#
# qmk-notifier is a pinned git dependency in Cargo.toml (tag = "vX.Y.Z"), so a
# plain `actions/checkout` of this repo is sufficient — no sibling checkout.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # macOS — QMKonnect.app + DMG, ad-hoc signed by default.
  # Set repo var ENABLE_MACOS_NOTARIZE=true + the APPLE_* secrets to switch to
  # Developer ID signing + notarization (no workflow changes needed beyond that).
  # ─────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: ${{ vars.ENABLE_MACOS_NOTARIZE == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build QMKonnect.app + DMG
        working-directory: packaging/macos
        env:
          # Ad-hoc ('-') unless notarization is enabled and an identity secret
          # is present.
          CODESIGN_IDENTITY: ${{ (vars.ENABLE_MACOS_NOTARIZE == 'true' && secrets.APPLE_SIGNING_IDENTITY) || '-' }}
          # Universal (aarch64 + x86_64) binary so the .app runs on Apple
          # Silicon AND Intel Macs. The macos-latest runner is arm64, so
          # without this the release fails to launch on Intel with
          # "…not supported on this Mac".
          MACOS_UNIVERSAL: "1"
        run: ./build.sh

      - name: Notarize + staple DMG
        if: ${{ vars.ENABLE_MACOS_NOTARIZE == 'true' }}
        working-directory: packaging/macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit QMKonnect.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple QMKonnect.dmg

      - name: Rename DMG with version
        working-directory: packaging/macos
        run: mv QMKonnect.dmg "QMKonnect-${{ steps.ver.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: packaging/macos/QMKonnect-*-macos.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Windows — end-user tray-app installer via Inno Setup (QMKonnect-Setup.exe).
  # Per-user, no-admin. See packaging/windows/inno/README.md.
  # ─────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
               Where-Object { $_.name -eq 'qmkonnect' } |
               Select-Object -ExpandProperty version
          "version=$v" | Add-Content -Path $env:GITHUB_OUTPUT

      # build.ps1 reads the version from Cargo.toml, locates ISCC.exe, and
      # compiles QMKonnect.iss -> Output/QMKonnect-Setup.exe.
      - name: Build installer (Inno Setup)
        working-directory: packaging/windows/inno
        shell: pwsh
        run: ./build.ps1

      - name: Rename installer with version
        working-directory: packaging/windows/inno
        shell: pwsh
        run: Move-Item Output/QMKonnect-Setup.exe "Output/QMKonnect-${{ steps.ver.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: packaging/windows/inno/Output/QMKonnect-*-windows-x64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Linux — portable binary tarball (broad glibc compatibility via 22.04).
  # Contains the two binaries + the static udev rule + the systemd template.
  # ─────────────────────────────────────────────────────────────────────────
  linux-binary:
    name: Linux (binary tarball)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev \
            libx11-dev libxcb1-dev libxdo-dev libhidapi-dev libudev-dev

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: cargo build (release)
        run: cargo build --release

      - name: Stage binary tarball
        run: |
          set -eux
          VER="${{ steps.ver.outputs.version }}"
          STAGE="qmkonnect-${VER}-linux-x86_64"
          mkdir -p "$STAGE/udev" "$STAGE/systemd"
          cp target/release/qmkonnect       "$STAGE/"
          cp target/release/qmkonnect-hid-id "$STAGE/"
          cp packaging/linux/udev/69-qmkonnect-rawhid.rules "$STAGE/udev/"
          cp packaging/linux/systemd/qmkonnect.service.template "$STAGE/systemd/"
          tar czf "${STAGE}.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: qmkonnect-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Arch Linux — .pkg.tar.zst built via makepkg in an archlinux container.
  # Second most likely job to need a first-run tweak (pacman deps / makepkg).
  # ─────────────────────────────────────────────────────────────────────────
  arch:
    name: Linux (Arch .pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Container ships no git, so install the full toolchain before checkout.
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel rust cargo git pkg-config jq \
            gtk3 glib2 libayatana-appindicator libx11 libxcb xdotool \
            hidapi libusb zenity libnotify systemd systemd-libs

      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # PKGBUILD ships a placeholder pkgver; sync it to the Cargo version.
      - name: Patch pkgver into PKGBUILD
        working-directory: packaging/linux/arch
        run: sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" PKGBUILD

      # makepkg refuses to run as root; build as an unprivileged user.
      - name: Build Arch package
        working-directory: packaging/linux/arch
        run: |
          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"
          # --nodeps: deps installed explicitly above (PKGBUILD's declared set is
          # incomplete for the tao/tray-icon stack); --skipinteg: no checksums.
          su builder -c "makepkg --noconfirm --nodeps --skipinteg"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: packaging/linux/arch/*.pkg.tar.zst
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Publish — only on real tag pushes (skipped for workflow_dispatch dry-runs).
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux-binary, arch]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: List release artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v0.2.0-rc.1 etc. publish as a prerelease; v0.2.0 as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/macos-dmg/*
            artifacts/windows-exe/*
            artifacts/linux-binary/*
            artifacts/arch-pkg/*

  # ─────────────────────────────────────────────────────────────────────────
  # AUR — publish qmkonnect-bin to the Arch User Repository.
  #
  # Runs AFTER `publish` (makepkg -g in publish.sh downloads the release
  # tarball, so the GitHub Release + its linux-binary asset must be live) and
  # only on real tag pushes (skipped for workflow_dispatch dry-runs, where the
  # release isn't published and makepkg -g would 404).
  #
  # SECRET — AUR_SSH_PRIVATE_KEY (REQUIRED for this job to do anything):
  #   The AUR authenticates via SSH-key ONLY (no token/password). The job loads
  #   the private half from this secret into the builder's ~/.ssh and publish.sh
  #   uses it to clone + push the AUR git repo.
  #
  #   One-time setup:
  #     1. Generate a dedicated key pair (do NOT reuse a personal key):
  #          ssh-keygen -t ed25519 -C "qmkonnect-aur-ci" -f qmkonnect-aur
  #     2. Register the PUBLIC half (qmkonnect-aur.pub) with the AUR account
  #        that owns qmkonnect-bin: https://aur.archlinux.org -> My Account ->
  #        Account Type -> SSH Public Key. (AUR keys are per-ACCOUNT, not per-repo.)
  #     3. Store the PRIVATE half (qmkonnect-aur, the full PEM including the
  #        BEGIN/END lines) as the AUR_SSH_PRIVATE_KEY Actions secret in
  #        dabstractor/qmkonnect (Settings -> Secrets and variables -> Actions
  #        -> New repository secret). Paste the file contents verbatim.
  #     4. Ensure the qmkonnect-bin AUR git repo exists (it does for a published
  #        package); publish.sh clones it.
  #
  #   Until this secret is set, the job is wired but the publish.sh step will
  #   fail at the `git clone aur@aur.archlinux.org:qmkonnect-bin.git` with
  #   "Permission denied (publickey)" — expected on the very first run.
  # ─────────────────────────────────────────────────────────────────────────
  aur:
    name: Publish to AUR (qmkonnect-bin)
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Container ships no build toolchain; install everything before checkout.
      # openssh is REQUIRED (the arch job omits it because it never SSHes; this
      # job clones/pushes the AUR over SSH and needs ssh + ssh-keyscan).
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel cargo git jq openssh

      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # makepkg refuses root, so create an unprivileged builder (mirrors the
      # `arch` job). The same builder runs publish.sh and holds the AUR SSH key.
      - name: Configure builder, SSH key, and git identity for AUR publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          # The SSH key + known_hosts + an explicit Host block live in BUILDER's
          # ~/.ssh (publish.sh's git clone runs as builder via `su builder -c`).
          SSH_DIR=/home/builder/.ssh
          install -d -m700 -o builder -g builder "$SSH_DIR"

          # Private key (full PEM, multi-line secret pasted verbatim).
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/aur_key"
          chmod 600 "$SSH_DIR/aur_key"
          chown builder "$SSH_DIR/aur_key"

          # Key-type-agnostic identity: pin the key to the AUR host so ssh finds
          # it regardless of filename (ed25519 or rsa). accept-new guards a
          # missed keyscan key type.
          cat > "$SSH_DIR/config" <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur_key
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          EOF
          chmod 600 "$SSH_DIR/config"
          chown builder "$SSH_DIR/config"

          # Pre-seed the host key so the first git clone is non-interactive.
          ssh-keyscan aur.archlinux.org >> "$SSH_DIR/known_hosts" || true
          chown builder "$SSH_DIR/known_hosts"

          # publish.sh commits to the AUR but sets NO git identity itself; give
          # the builder one or `git commit` fails ("Author identity unknown").
          su builder -c 'git config --global user.email "qmkonnect-bot@users.noreply.github.com"'
          su builder -c 'git config --global user.name  "QMKonnect release automation"'

      # publish.sh does ALL the AUR-side work: patch pkgver, refresh sha256sums
      # (makepkg -g downloads the release tarball), regenerate .SRCINFO, clone
      # the AUR repo, copy PKGBUILD + .SRCINFO + qmkonnect.install, commit, push.
      - name: Publish qmkonnect-bin to the AUR
        working-directory: packaging/linux/aur
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # $VERSION expands in the su'd builder shell, not here.
          su builder -c 'set -euo pipefail; ./publish.sh "$VERSION"'

  # ─────────────────────────────────────────────────────────────────────────
  # Homebrew tap — publish the patched cask to dabstractor/homebrew-qmkonnect.
  #
  # Runs AFTER `publish` (the cask's sha256 is the hash of the release DMG,
  # which exists only once `publish` attaches it to the GitHub Release) and
  # only on real tag pushes (skipped for workflow_dispatch dry-runs, where the
  # release isn't published and the DMG download would 404).
  #
  # SECRET — HOMEBREW_TAP_DEPLOY_KEY (REQUIRED for this job to do anything):
  #   The tap repo is pushed via a GitHub deploy key (SSH, WRITE access).
  #
  #   One-time setup:
  #     1. Generate a dedicated ed25519 key pair (do NOT reuse a personal key):
  #          ssh-keygen -t ed25519 -C "qmkonnect-homebrew-ci" -f qmkonnect-homebrew
  #     2. Add the PUBLIC half (qmkonnect-homebrew.pub) to the tap repo
  #        dabstractor/homebrew-qmkonnect: Settings → Deploy keys → "Add new
  #        deploy key". CHECK "Allow write access" (or the push is denied).
  #     3. Store the PRIVATE half (qmkonnect-homebrew, the full PEM incl. the
  #        BEGIN/END lines) as the HOMEBREW_TAP_DEPLOY_KEY Actions secret in
  #        dabstractor/qmkonnect (Settings → Secrets and variables → Actions).
  #
  #   This is a per-REPO GitHub deploy key (the public half lives on the tap
  #   repo), NOT the AUR per-account SSH-key model. webfactory/ssh-agent loads
  #   the key into ssh-agent and pre-trusts github.com, so the git clone over
  #   SSH is non-interactive. Until this secret is set, the clone step fails
  #   with "Permission denied (publickey)" — expected on the very first run.
  # ─────────────────────────────────────────────────────────────────────────
  homebrew-tap:
    name: Publish to Homebrew tap (homebrew-qmkonnect)
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job builds NO Rust. The workflow only triggers on `v*` tags, so
      # GITHUB_REF_NAME is the tag (v0.2.8); stripping the leading 'v' yields
      # the bare version (0.2.8) update-cask.sh requires (it rejects a 'v').
      # cargo-release cuts the tag from Cargo.toml, so this is transitively the
      # Cargo.toml version (architecture/external_deps.md "Version Source of Truth").
      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # update-cask.sh CAN download the DMG itself, but the contract wants the
      # job to own the download + hash (single download; visible in CI logs).
      # sha256sum yields lowercase 64-hex, which update-cask.sh validates.
      - name: Download release DMG and compute SHA256
        id: dmg
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          url="https://github.com/dabstractor/qmkonnect/releases/download/v${VERSION}/QMKonnect-${VERSION}-macos.dmg"
          tmp="$(mktemp)"
          curl -fL "$url" -o "$tmp"
          echo "sha256=$(sha256sum "$tmp" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          rm -f "$tmp"

      # Patches version + sha256 in packaging/homebrew/Casks/qmkonnect.rb IN THE
      # SOURCE CHECKOUT. Passing the hash (2-arg form) skips the script's own
      # download. PURE local update — does NOT push (the job does, next).
      - name: Patch cask (update-cask.sh)
        working-directory: packaging/homebrew
        run: ./update-cask.sh "${{ steps.ver.outputs.version }}" "${{ steps.dmg.outputs.sha256 }}"

      # Loads the deploy key into ssh-agent + pre-trusts github.com (built-in
      # host-key list). NOTE: the repo is `webfactory/ssh-agent` — the
      # bucket-README's `webfactory/agents/github-ssh-agent` path DOES NOT EXIST.
      - name: Configure SSH deploy key for the tap repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      # update-cask.sh patched the SOURCE-checkout cask; copy it into the tap
      # clone, set a git identity (the script doesn't push — the job owns the
      # commit), commit, and push over the deploy key.
      - name: Push patched cask to the tap repo
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git clone git@github.com:dabstractor/homebrew-qmkonnect.git tap-repo
          cp packaging/homebrew/Casks/qmkonnect.rb tap-repo/Casks/qmkonnect.rb
          cd tap-repo
          git config user.email "qmkonnect-bot@users.noreply.github.com"
          git config user.name  "QMKonnect release automation"
          git add Casks/qmkonnect.rb
          git commit -m "qmkonnect cask v${VERSION}"
          git push

  # ─────────────────────────────────────────────────────────────────────────
  # Scoop bucket — publish the patched manifest to dabstractor/scoop-qmkonnect.
  #
  # Runs AFTER `publish` (the manifest's hash is the SHA256 of the release
  # Inno installer, which exists only once `publish` attaches it) and only on
  # real tag pushes (skipped for workflow_dispatch dry-runs).
  #
  # SECRET — SCOOP_BUCKET_DEPLOY_KEY (REQUIRED for this job to do anything):
  #   The bucket repo is pushed via a GitHub deploy key (SSH, WRITE access).
  #
  #   One-time setup:
  #     1. Generate a dedicated ed25519 key pair:
  #          ssh-keygen -t ed25519 -C "qmkonnect-scoop-ci" -f qmkonnect-scoop
  #     2. Add the PUBLIC half (qmkonnect-scoop.pub) to the bucket repo
  #        dabstractor/scoop-qmkonnect: Settings → Deploy keys → "Add new
  #        deploy key". CHECK "Allow write access" (or the push is denied).
  #     3. Store the PRIVATE half (qmkonnect-scoop, full PEM) as the
  #        SCOOP_BUCKET_DEPLOY_KEY Actions secret in dabstractor/qmkonnect.
  #
  #   Per-REPO GitHub deploy key (public half on the bucket repo). Same model
  #   as the Homebrew tap key above. Until set, the clone step fails with
  #   "Permission denied (publickey)" — expected on the very first run.
  # ─────────────────────────────────────────────────────────────────────────
  scoop-bucket:
    name: Publish to Scoop bucket (scoop-qmkonnect)
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Download the Inno installer + hash it (sha256sum → lowercase 64-hex,
      # which update-manifest.ps1 validates via ^[0-9a-f]{64}$).
      - name: Download release installer and compute SHA256
        id: exe
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          url="https://github.com/dabstractor/qmkonnect/releases/download/v${VERSION}/QMKonnect-${VERSION}-windows-x64.exe"
          tmp="$(mktemp)"
          curl -fL "$url" -o "$tmp"
          echo "sha256=$(sha256sum "$tmp" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          rm -f "$tmp"

      # Patches version + concrete url + hash in packaging/scoop/qmkonnect.json
      # IN THE SOURCE CHECKOUT (leaves the autoupdate $version template). Passing
      # -Sha256 skips the script's own download. pwsh 7+ is preinstalled on
      # ubuntu-latest; the script is cross-platform by design. PURE local update.
      - name: Patch manifest (update-manifest.ps1)
        working-directory: packaging/scoop
        shell: pwsh
        run: ./update-manifest.ps1 -Version "${{ steps.ver.outputs.version }}" -Sha256 "${{ steps.exe.outputs.sha256 }}"

      - name: Configure SSH deploy key for the bucket repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}

      # Copy the patched manifest into the bucket clone. NOTE the external repo
      # layout: the manifest lives in a `bucket/` subdir (BucketTemplate
      # convention), so the destination is bucket-repo/bucket/qmkonnect.json
      # (clone dir named `bucket-repo` to avoid the confusing bucket/bucket path).
      - name: Push patched manifest to the bucket repo
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git clone git@github.com:dabstractor/scoop-qmkonnect.git bucket-repo
          cp packaging/scoop/qmkonnect.json bucket-repo/bucket/qmkonnect.json
          cd bucket-repo
          git config user.email "qmkonnect-bot@users.noreply.github.com"
          git config user.name  "QMKonnect release automation"
          git add bucket/qmkonnect.json
          git commit -m "qmkonnect manifest v${VERSION}"
          git push

  # ─────────────────────────────────────────────────────────────────────────
  # Winget — open a per-release PR to microsoft/winget-pkgs for
  # dabstractor.QMKonnect (the Windows community channel, PRD §4 F15).
  #
  # Uses vedantmgoyal9/winget-releaser@v2 (Komac under the hood), which finds
  # the release's .exe via installers-regex, computes its SHA256, syncs a fork of
  # microsoft/winget-pkgs under dabstractor/winget-pkgs, and opens an update PR
  # (fork -> microsoft:main). Runs on ubuntu-latest (Komac is cross-platform; no
  # windows-latest + wingetcreate install needed).
  #
  # Runs AFTER `publish` (the action reads the GitHub Release by tag to find the
  # .exe asset — release-repository/release-tag default to this repo + the pushed
  # tag) and only on real tag pushes (workflow_dispatch dry-runs don't publish a
  # release, so the releases/tags/<tag> API call would 404).
  #
  # PREREQUISITE: dabstractor.QMKonnect must ALREADY exist in winget-pkgs (the
  #   one-time manual `wingetcreate new` — see packaging/winget/README.md
  #   "Publishing to microsoft/winget-pkgs"). Until that first PR is merged, this
  #   job's first run errors with "Package dabstractor.QMKonnect does not exist
  #   in the winget-pkgs repository. Please add atleast one version of the
  #   package before using this action." — EXPECTED on the very first release.
  #
  # SECRET — WINGET_GITHUB_TOKEN (REQUIRED for this job to do anything):
  #   A CLASSIC GitHub PAT with the `public_repo` scope. The default GITHUB_TOKEN
  #   is scoped to dabstractor/qmkonnect only and CANNOT fork
  #   microsoft/winget-pkgs. winget-releaser/Komac auto-creates the fork
  #   <owner>/winget-pkgs (fork-user defaults to dabstractor) under the token's
  #   account, pushes a branch, and PRs to microsoft/winget-pkgs:main.
  #
  #   One-time setup:
  #     1. Create a CLASSIC PAT: https://github.com/settings/tokens ->
  #        Tokens (classic) -> "Generate new token (classic)" -> check
  #        `public_repo` (the only scope needed to fork a public repo + open a
  #        PR). Use a CLASSIC token, not fine-grained.
  #     2. Store it as the WINGET_GITHUB_TOKEN Actions secret in
  #        dabstractor/qmkonnect (Settings -> Secrets and variables -> Actions ->
  #        New repository secret).
  #     3. (One-time, manual, on a Windows host) submit the first version with
  #        `wingetcreate new <installerURL> --token <PAT> --submit` (fill
  #        metadata from packaging/winget/*.yaml) so dabstractor.QMKonnect exists
  #        in winget-pkgs — see packaging/winget/README.md.
  #
  #   This is a CLASSIC PAT (not the AUR per-account SSH-key model, not the
  #   Homebrew/Scoop per-repo deploy-key model). Until this secret is set, the
  #   job runs but Komac fails to fork/push with a 401/403 — expected until the
  #   PAT is configured. The token is never logged (it travels only inside the
  #   action's inputs.token).
  # ─────────────────────────────────────────────────────────────────────────
  winget:
    name: Publish to Winget (winget-pkgs PR)
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # This job builds NO Rust. The workflow only triggers on `v*` tags, so
      # GITHUB_REF_NAME is the tag (v0.2.8); stripping the leading 'v' yields
      # the bare version (0.2.8) the winget-releaser `version` input needs.
      # The action uses a PROVIDED version VERBATIM (it strips a leading 'v'
      # ONLY when version is OMITTED — see the action's action.yml), so we MUST
      # pass a bare value here — never the raw v-prefixed tag.
      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # winget-releaser finds the installer in the GitHub Release (release-tag
      # defaults to github.ref_name on a push event; release-repository defaults
      # to the repo name `qmkonnect` and the action prepends the owner ->
      # dabstractor/qmkonnect), hashes it, and opens the PR. fork-user defaults
      # to dabstractor (-> dabstractor/winget-pkgs). OMIT release-repository:
      # setting `dabstractor/qmkonnect` would DOUBLE the owner (action.yml
      # prepends github.repository_owner itself) -> 404.
      - name: Submit winget-pkgs PR (winget-releaser)
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: dabstractor.QMKonnect
          # Bare version (no leading 'v'); see the ver step above.
          version: ${{ steps.ver.outputs.version }}
          installers-regex: 'QMKonnect-.*-windows-x64\.exe$'
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # asdf plugin — publish packaging/asdf/ to dabstractor/asdf-qmkonnect
  # (the cross-platform version-manager channel, PRD §4 F15; serves BOTH asdf
  # AND mise, which is asdf-compatible).
  #
  # Runs AFTER `publish` (so the plugin's stamped example versions + commit
  # message reference a RELEASED version) and only on real tag pushes (skipped
  # for workflow_dispatch dry-runs). publish.sh downloads NO release asset —
  # asdf resolves versions at runtime via bin/list-all's GitHub Releases API —
  # so the release dependency is only the version string.
  #
  # FLOW: (1) TEST the plugin with NO secrets — shellcheck + publish.sh
  #   --dry-run against a LOCAL file:// mock remote (validates the full
  #   clone→sync→chmod→sed→commit flow, skipping only the push); (2) load the
  #   SSH deploy key; (3) PUBLISH via publish.sh (clones the real repo, syncs
  #   the plugin scripts + metadata, stamps the version, commits, pushes).
  #   publish.sh sets its OWN git identity — this job does NOT set git config.
  #
  # SECRET — ASDF_PLUGIN_DEPLOY_KEY (REQUIRED for the publish step):
  #   The plugin repo is pushed via a GitHub deploy key (SSH, WRITE access).
  #
  #   One-time setup:
  #     1. Generate a dedicated ed25519 key pair (do NOT reuse a personal key):
  #          ssh-keygen -t ed25519 -C "qmkonnect-asdf-ci" -f qmkonnect-asdf
  #     2. Add the PUBLIC half (qmkonnect-asdf.pub) to the plugin repo
  #        dabstractor/asdf-qmkonnect: Settings → Deploy keys → "Add new
  #        deploy key". CHECK "Allow write access" (or the push is denied).
  #     3. Store the PRIVATE half (qmkonnect-asdf, the full PEM incl. the
  #        BEGIN/END lines) as the ASDF_PLUGIN_DEPLOY_KEY Actions secret in
  #        dabstractor/qmkonnect (Settings → Secrets and variables → Actions).
  #     4. Ensure dabstractor/asdf-qmkonnect PRE-EXISTS on GitHub (empty is
  #        fine — create it once at github.com/new; do NOT add a README so the
  #        first push is clean). publish.sh clones it; a missing repo 404s.
  #
  #   Per-REPO GitHub deploy key (public half on the plugin repo) — the SAME
  #   model as HOMEBREW_TAP_DEPLOY_KEY + SCOOP_BUCKET_DEPLOY_KEY (NOT the AUR
  #   per-account SSH-key model, NOT the Winget classic-PAT model). Until this
  #   secret is set, the publish step fails with "Permission denied (publickey)"
  #   — expected on the very first run. The TEST steps run with NO secret.
  # ─────────────────────────────────────────────────────────────────────────
  asdf-plugin:
    name: Publish to asdf plugin (asdf-qmkonnect)
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build-less: GITHUB_REF_NAME is the tag (v0.2.8); strip the 'v' for the
      # BARE version publish.sh requires (it REJECTS a leading 'v').
      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── TEST (no secrets) ─────────────────────────────────────────────
      # shellcheck is preinstalled on ubuntu-latest. The plugin scripts carry
      # `# shellcheck disable=SC1091` for the sourced utils.bash (intentional;
      # not a real failure). FAIL on real issues. Verified clean at author time.
      - name: shellcheck plugin scripts
        run: shellcheck packaging/asdf/bin/* packaging/asdf/lib/*.bash packaging/asdf/publish.sh

      # Dry-run publish.sh against a LOCAL bare mock remote (file://, no SSH, no
      # secret). Exercises the full clone→sync→chmod→sed-stamp→git-add→commit
      # flow and verifies the bin/* exec bit lands as 100755 in the index; only
      # the push is skipped. publish.sh rejects a leading 'v' → bare VERSION.
      # ASDF_QMKONNECT_REMOTE overrides its default git@ remote.
      - name: Test publish.sh (dry-run against a local mock remote)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git init --bare /tmp/asdf-mock.git
          ASDF_QMKONNECT_REMOTE=file:///tmp/asdf-mock.git \
            ./packaging/asdf/publish.sh --dry-run "$VERSION"

      # ── PUBLISH ───────────────────────────────────────────────────────
      # Loads the deploy key into ssh-agent + pre-trusts github.com (built-in
      # host-key list). MUST run before publish.sh — its `git clone` uses SSH.
      - name: Configure SSH deploy key for the plugin repo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ASDF_PLUGIN_DEPLOY_KEY }}

      # publish.sh clones dabstractor/asdf-qmkonnect over the deploy key, syncs
      # packaging/asdf/{bin,lib,README.md,.tool-versions,mise.toml,CHANGELOG.md},
      # stamps the version into .tool-versions + mise.toml, verifies the bin/*
      # exec bit (100755), commits, and pushes. It sets its OWN git identity —
      # do NOT set git config here.
      - name: Publish to asdf-qmkonnect (publish.sh)
        working-directory: packaging/asdf
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./publish.sh "$VERSION"
