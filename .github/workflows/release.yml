name: Release

# Builds the per-platform installers/binaries and publishes a GitHub Release.
#
# Two triggers:
#   * push of a `v*` tag  -> builds everything AND publishes the release
#   * workflow_dispatch   -> builds everything WITHOUT publishing, so you can
#                            dry-run the whole pipeline (and download the real
#                            .dmg / .exe / .pkg.tar.zst from the run) before you
#                            ever cut a tag. Use this to get Windows/macOS working.
#
# qmk-notifier is a pinned git dependency in Cargo.toml (tag = "vX.Y.Z"), so a
# plain `actions/checkout` of this repo is sufficient — no sibling checkout.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # macOS — QMKonnect.app + DMG, ad-hoc signed by default.
  # Set repo var ENABLE_MACOS_NOTARIZE=true + the APPLE_* secrets to switch to
  # Developer ID signing + notarization (no workflow changes needed beyond that).
  # ─────────────────────────────────────────────────────────────────────────
  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: ${{ vars.ENABLE_MACOS_NOTARIZE == 'true' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build QMKonnect.app + DMG
        working-directory: packaging/macos
        env:
          # Ad-hoc ('-') unless notarization is enabled and an identity secret
          # is present.
          CODESIGN_IDENTITY: ${{ (vars.ENABLE_MACOS_NOTARIZE == 'true' && secrets.APPLE_SIGNING_IDENTITY) || '-' }}
          # Universal (aarch64 + x86_64) binary so the .app runs on Apple
          # Silicon AND Intel Macs. The macos-latest runner is arm64, so
          # without this the release fails to launch on Intel with
          # "…not supported on this Mac".
          MACOS_UNIVERSAL: "1"
        run: ./build.sh

      - name: Notarize + staple DMG
        if: ${{ vars.ENABLE_MACOS_NOTARIZE == 'true' }}
        working-directory: packaging/macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit QMKonnect.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple QMKonnect.dmg

      - name: Rename DMG with version
        working-directory: packaging/macos
        run: mv QMKonnect.dmg "QMKonnect-${{ steps.ver.outputs.version }}-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: packaging/macos/QMKonnect-*-macos.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Windows — end-user tray-app installer via Inno Setup (QMKonnect-Setup.exe).
  # Per-user, no-admin. See packaging/windows/inno/README.md.
  # ─────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo build (release)
        run: cargo build --release

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
               Where-Object { $_.name -eq 'qmkonnect' } |
               Select-Object -ExpandProperty version
          "version=$v" | Add-Content -Path $env:GITHUB_OUTPUT

      # build.ps1 reads the version from Cargo.toml, locates ISCC.exe, and
      # compiles QMKonnect.iss -> Output/QMKonnect-Setup.exe.
      - name: Build installer (Inno Setup)
        working-directory: packaging/windows/inno
        shell: pwsh
        run: ./build.ps1

      - name: Rename installer with version
        working-directory: packaging/windows/inno
        shell: pwsh
        run: Move-Item Output/QMKonnect-Setup.exe "Output/QMKonnect-${{ steps.ver.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: packaging/windows/inno/Output/QMKonnect-*-windows-x64.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Linux — portable binary tarball (broad glibc compatibility via 22.04).
  # Contains the two binaries + the static udev rule + the systemd template.
  # ─────────────────────────────────────────────────────────────────────────
  linux-binary:
    name: Linux (binary tarball)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev \
            libx11-dev libxcb1-dev libxdo-dev libhidapi-dev libudev-dev

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: cargo build (release)
        run: cargo build --release

      - name: Stage binary tarball
        run: |
          set -eux
          VER="${{ steps.ver.outputs.version }}"
          STAGE="qmkonnect-${VER}-linux-x86_64"
          mkdir -p "$STAGE/udev" "$STAGE/systemd"
          cp target/release/qmkonnect       "$STAGE/"
          cp target/release/qmkonnect-hid-id "$STAGE/"
          cp packaging/linux/udev/69-qmkonnect-rawhid.rules "$STAGE/udev/"
          cp packaging/linux/systemd/qmkonnect.service.template "$STAGE/systemd/"
          tar czf "${STAGE}.tar.gz" "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: qmkonnect-*-linux-x86_64.tar.gz
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Arch Linux — .pkg.tar.zst built via makepkg in an archlinux container.
  # Second most likely job to need a first-run tweak (pacman deps / makepkg).
  # ─────────────────────────────────────────────────────────────────────────
  arch:
    name: Linux (Arch .pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Container ships no git, so install the full toolchain before checkout.
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel rust cargo git pkg-config jq \
            gtk3 glib2 libayatana-appindicator libx11 libxcb xdotool \
            hidapi libusb zenity libnotify systemd systemd-libs

      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # PKGBUILD ships a placeholder pkgver; sync it to the Cargo version.
      - name: Patch pkgver into PKGBUILD
        working-directory: packaging/linux/arch
        run: sed -i "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" PKGBUILD

      # makepkg refuses to run as root; build as an unprivileged user.
      - name: Build Arch package
        working-directory: packaging/linux/arch
        run: |
          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"
          # --nodeps: deps installed explicitly above (PKGBUILD's declared set is
          # incomplete for the tao/tray-icon stack); --skipinteg: no checksums.
          su builder -c "makepkg --noconfirm --nodeps --skipinteg"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-pkg
          path: packaging/linux/arch/*.pkg.tar.zst
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Publish — only on real tag pushes (skipped for workflow_dispatch dry-runs).
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [macos, windows, linux-binary, arch]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: List release artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v0.2.0-rc.1 etc. publish as a prerelease; v0.2.0 as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/macos-dmg/*
            artifacts/windows-exe/*
            artifacts/linux-binary/*
            artifacts/arch-pkg/*

  # ─────────────────────────────────────────────────────────────────────────
  # AUR — publish qmkonnect-bin to the Arch User Repository.
  #
  # Runs AFTER `publish` (makepkg -g in publish.sh downloads the release
  # tarball, so the GitHub Release + its linux-binary asset must be live) and
  # only on real tag pushes (skipped for workflow_dispatch dry-runs, where the
  # release isn't published and makepkg -g would 404).
  #
  # SECRET — AUR_SSH_PRIVATE_KEY (REQUIRED for this job to do anything):
  #   The AUR authenticates via SSH-key ONLY (no token/password). The job loads
  #   the private half from this secret into the builder's ~/.ssh and publish.sh
  #   uses it to clone + push the AUR git repo.
  #
  #   One-time setup:
  #     1. Generate a dedicated key pair (do NOT reuse a personal key):
  #          ssh-keygen -t ed25519 -C "qmkonnect-aur-ci" -f qmkonnect-aur
  #     2. Register the PUBLIC half (qmkonnect-aur.pub) with the AUR account
  #        that owns qmkonnect-bin: https://aur.archlinux.org -> My Account ->
  #        Account Type -> SSH Public Key. (AUR keys are per-ACCOUNT, not per-repo.)
  #     3. Store the PRIVATE half (qmkonnect-aur, the full PEM including the
  #        BEGIN/END lines) as the AUR_SSH_PRIVATE_KEY Actions secret in
  #        dabstractor/qmkonnect (Settings -> Secrets and variables -> Actions
  #        -> New repository secret). Paste the file contents verbatim.
  #     4. Ensure the qmkonnect-bin AUR git repo exists (it does for a published
  #        package); publish.sh clones it.
  #
  #   Until this secret is set, the job is wired but the publish.sh step will
  #   fail at the `git clone aur@aur.archlinux.org:qmkonnect-bin.git` with
  #   "Permission denied (publickey)" — expected on the very first run.
  # ─────────────────────────────────────────────────────────────────────────
  aur:
    name: Publish to AUR (qmkonnect-bin)
    needs: [publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Container ships no build toolchain; install everything before checkout.
      # openssh is REQUIRED (the arch job omits it because it never SSHes; this
      # job clones/pushes the AUR over SSH and needs ssh + ssh-keyscan).
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel cargo git jq openssh

      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          v=$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name=="qmkonnect") | .version')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # makepkg refuses root, so create an unprivileged builder (mirrors the
      # `arch` job). The same builder runs publish.sh and holds the AUR SSH key.
      - name: Configure builder, SSH key, and git identity for AUR publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          useradd -m -G wheel builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder "$GITHUB_WORKSPACE"

          # The SSH key + known_hosts + an explicit Host block live in BUILDER's
          # ~/.ssh (publish.sh's git clone runs as builder via `su builder -c`).
          SSH_DIR=/home/builder/.ssh
          install -d -m700 -o builder -g builder "$SSH_DIR"

          # Private key (full PEM, multi-line secret pasted verbatim).
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/aur_key"
          chmod 600 "$SSH_DIR/aur_key"
          chown builder "$SSH_DIR/aur_key"

          # Key-type-agnostic identity: pin the key to the AUR host so ssh finds
          # it regardless of filename (ed25519 or rsa). accept-new guards a
          # missed keyscan key type.
          cat > "$SSH_DIR/config" <<'EOF'
          Host aur.archlinux.org
              IdentityFile ~/.ssh/aur_key
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          EOF
          chmod 600 "$SSH_DIR/config"
          chown builder "$SSH_DIR/config"

          # Pre-seed the host key so the first git clone is non-interactive.
          ssh-keyscan aur.archlinux.org >> "$SSH_DIR/known_hosts" || true
          chown builder "$SSH_DIR/known_hosts"

          # publish.sh commits to the AUR but sets NO git identity itself; give
          # the builder one or `git commit` fails ("Author identity unknown").
          su builder -c 'git config --global user.email "qmkonnect-bot@users.noreply.github.com"'
          su builder -c 'git config --global user.name  "QMKonnect release automation"'

      # publish.sh does ALL the AUR-side work: patch pkgver, refresh sha256sums
      # (makepkg -g downloads the release tarball), regenerate .SRCINFO, clone
      # the AUR repo, copy PKGBUILD + .SRCINFO + qmkonnect.install, commit, push.
      - name: Publish qmkonnect-bin to the AUR
        working-directory: packaging/linux/aur
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # shellcheck disable=SC2016 # $VERSION expands in the su'd builder shell, not here.
          su builder -c 'set -euo pipefail; ./publish.sh "$VERSION"'
