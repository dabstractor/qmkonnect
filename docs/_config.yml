title: QMKonnect
description: Cross-platform window activity notifier for QMK keyboards
baseurl: "/qmkonnect"
url: "https://dabstractor.github.io"
repository: dabstractor/qmkonnect

# Use Midnight theme (GitHub Pages supported, clean dark theme)
remote_theme: pages-themes/midnight@v0.2.0

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme

# Site settings
lang: en

# GitHub info
github_username: dabstractor

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/